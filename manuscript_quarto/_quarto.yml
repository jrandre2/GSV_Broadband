project:
  type: manuscript
  output-dir: _output

title: "Predicting Broadband Usage: A Comparison of Computer Vision and Rural-Urban Typology Machine Learning Models"
author:
  - name: Jesse R. Andrews
    affiliation: "Center of Excellence in Capacity-building for Resilient Housing; Department of Civil, Environmental & Construction Engineering, Texas Tech University"
    email: jesse.andrews@ttu.edu
  - name: Angela K. Hollman
    affiliation: "Department of Cyber Systems, University of Nebraska Kearney"
    email: hollmanak@unk.edu
keywords:
  - broadband
  - computer vision
  - machine learning
  - rural-urban typology
  - spatial cross-validation

abstract: |
  Effective broadband policy depends on accurate identification of underserved communities, yet
  federal mapping data has historically suffered from coverage overestimation and latency. In
  response, policymakers are increasingly exploring novel machine learning techniques to audit
  coverage claims. This study evaluates the administrative utility of one such approach: using
  street-level imagery and computer vision to predict broadband usage. We extract visual
  features from 7,619 Google Street View images across 264 Nebraska ZCTAs and compare their
  predictive power against a standard, low-cost administrative baseline: the USDA's
  Rural-Urban Commuting Area (RUCA) codes.

  We find that simple geographic typologies (RUCA) consistently outperform complex computer
  vision models ($R^2$ = 0.40 vs. 0.37). Furthermore, spatial cross-validation reveals that both
  approaches struggle to generalize to isolated geographic regions, suggesting that neither
  method is suitable for cross-jurisdictional deployment without local recalibration.

