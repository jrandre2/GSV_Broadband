name: street2vec
channels:
  - pytorch-nightly
  - conda-forge
dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - torchaudio
  - geopandas
  - pandas
  - pyogrio
  - scikit-learn
  - shapely
  - tqdm
  - rtree
  - opencv
  - snakemake
  - pip
  - pip:
    - lightning==2.3.0
    - torchmetrics==1.3.0
    - mlflow==2.13.0
    - tensorflow==2.20.0
